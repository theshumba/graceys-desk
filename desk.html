:root{
  /* REAL — from their StoreKit branding config and their logo */
  --ink:#143f14;          /* bottle green. the ink. */
  --ink-2:#2f6e56;        /* brand green. headings, secondary. */
  --ink-3:#3c896c;        /* mid green. borders, hover. */
  --go:#49a35a;           /* button green. the only bright green. */
  --page:#ffffff;
  --paper:#fafafa;        /* warm white. panel ground. */
  /* DERIVED — signwriter's red off their own kitchen signage. One accent, trouble only. */
  --alarm:#a8271c;

  --hair:1px solid var(--ink);
  --hair-soft:1px solid rgba(20,63,20,.18);

  --display:"TG Gasoline","Oswald","Haettenschweiler","Arial Narrow",Impact,sans-serif;
  --body:"Gracey Neue","Helvetica Neue",Helvetica,-apple-system,BlinkMacSystemFont,Arial,sans-serif;

  --pad:clamp(12px,1.6vw,22px);
  --rail:clamp(280px,26vw,380px);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* main and nav are given a display below, which would otherwise beat [hidden]. */
[hidden]{display:none !important}
html,body{min-height:100%}
body{
  background:var(--page); color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.25;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- shell ---------- */
/* No overflow on #app. Hiding one axis turns it into a scroll container and the
   sticky header goes with it. */
#app{display:flex;flex-direction:column;height:100dvh}

/* ---------- header ---------- */
header{
  background:var(--ink); color:var(--page);
  display:flex;align-items:center;gap:var(--pad);
  padding:10px var(--pad); flex:none;
  padding-top:calc(10px + env(safe-area-inset-top));
}
header img{width:44px;height:44px;display:block;flex:none}
.site{font-family:var(--display);font-size:clamp(20px,2.4vw,30px);letter-spacing:.04em;line-height:1;white-space:nowrap}
.site small{display:block;font-size:.42em;letter-spacing:.22em;opacity:.72;margin-top:5px}
.switch{display:flex;margin-left:22px;flex:none}
.switch button{
  font-family:var(--display);font-size:clamp(12px,1.1vw,15px);letter-spacing:.14em;
  padding:8px 14px;border:1px solid rgba(255,255,255,.42);color:var(--page);white-space:nowrap
}
.switch button+button{border-left:0}
.switch button[aria-current="true"]{background:var(--page);color:var(--ink);border-color:var(--page)}
.clock{margin-left:auto;text-align:right;line-height:1;white-space:nowrap}
.clock b{font-family:var(--display);font-size:clamp(26px,3.2vw,42px);font-weight:400;letter-spacing:.02em;display:block}
.clock span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.72;display:block;margin-top:6px}

/* ---------- sample-day band ---------- */
.band{
  background:var(--paper);border-bottom:var(--hair);
  padding:9px var(--pad);font-size:13px;color:var(--ink-2);
  display:flex;gap:8px;align-items:baseline;flex:none
}
.band b{font-family:var(--display);font-size:14px;letter-spacing:.14em;color:var(--ink);flex:none}

/* ---------- site tabs ---------- */
.sitebar{background:var(--ink-2);border-bottom:0}
.sitebar button{
  color:rgba(255,255,255,.72);border-right:1px solid rgba(255,255,255,.22);
  font-size:clamp(13px,1.3vw,17px);padding:11px 18px
}
.sitebar button[aria-current="true"]{background:var(--page);color:var(--ink)}
.sitebar button i{opacity:.75}

/* ---------- day tabs ---------- */
nav{
  display:flex;flex:none;border-bottom:var(--hair);
  background:var(--page);overflow-x:auto;scrollbar-width:none
}
nav::-webkit-scrollbar{display:none}
nav button{
  font-family:var(--display);font-size:clamp(15px,1.5vw,20px);letter-spacing:.1em;
  padding:12px 18px;border-right:var(--hair-soft);color:var(--ink-2);
  white-space:nowrap;flex:none;position:relative
}
nav button[aria-current="true"]{background:var(--ink);color:var(--page)}
nav button i{font-style:normal;font-size:.62em;letter-spacing:.14em;opacity:.6;display:block;margin-top:3px}

/* ---------- body split ----------
   Three panes, not two, so the phone can put the number above the queue and the
   controls below it without duplicating any markup. */
main{
  display:grid;flex:1;min-height:0;min-width:0;
  grid-template-columns:minmax(0,1fr) var(--rail);
  grid-template-areas:"queue top" "queue rest";
  grid-template-rows:auto minmax(0,1fr)
}
.queue{
  grid-area:queue;min-width:0;overflow-y:auto;overscroll-behavior:contain;
  padding-bottom:40vh;border-right:var(--hair)
}
/* Nothing to put in the rail, so do not draw an empty one. */
main.solo{grid-template-columns:minmax(0,1fr);grid-template-areas:"queue"}
main.solo .rail-top,main.solo .rail-rest{display:none}
main.solo .queue{border-right:0}
.rail-top{grid-area:top;background:var(--paper);padding:var(--pad)}
.rail-rest{
  grid-area:rest;background:var(--paper);padding:0 var(--pad) var(--pad);
  overflow-y:auto;display:flex;flex-direction:column;gap:var(--pad);min-width:0
}

/* ---------- rail: the numbers ---------- */
.label{font-family:var(--display);font-size:13px;letter-spacing:.2em;color:var(--ink-2)}
.huge{font-family:var(--display);font-size:clamp(64px,7.5vw,116px);line-height:.84;letter-spacing:-.01em;margin:6px 0 8px}
.sub{font-size:14px;color:var(--ink-2);line-height:1.35}
.sub b{color:var(--ink)}

.callout{
  border:var(--hair);background:var(--page);padding:12px 14px;
  font-family:var(--display);font-size:clamp(17px,1.8vw,23px);letter-spacing:.06em;line-height:1.2
}
.callout small{display:block;font-family:var(--body);font-size:12px;letter-spacing:0;color:var(--ink-2);margin-top:5px;line-height:1.35}
.callout.bad{border-color:var(--alarm);color:var(--alarm)}
.callout.bad small{color:var(--alarm);opacity:.8}

.dial{display:flex;gap:10px;flex-wrap:wrap}
.tile{flex:1 1 145px;min-width:0;border:var(--hair);background:var(--page);padding:9px 10px;line-height:1.1}
.tile span{font-family:var(--display);font-size:11px;letter-spacing:.18em;color:var(--ink-2);display:block}
.tile .set{display:flex;align-items:center;gap:6px;margin-top:5px;min-width:0}
.tile input{
  font-family:var(--display);font-size:clamp(22px,2.4vw,32px);color:var(--ink);
  flex:1 1 auto;width:100%;min-width:0;border:0;background:none;padding:0;text-align:center;
  -moz-appearance:textfield;font-variant-numeric:tabular-nums
}
.tile input::-webkit-outer-spin-button,.tile input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tile input:focus{outline:2px solid var(--go);outline-offset:3px}
.tile .step{
  font-family:var(--display);font-size:20px;line-height:1;border:var(--hair);
  width:34px;height:34px;flex:none;color:var(--ink)
}
.tile .step:active{background:var(--ink);color:var(--page)}

/* ---------- rail: hour strip ---------- */
.hours{display:flex;flex-direction:column;gap:5px}
.hour{display:grid;grid-template-columns:44px 1fr 34px;align-items:center;gap:8px}
.hour em{font-family:var(--display);font-size:16px;font-style:normal;letter-spacing:.04em;color:var(--ink-2)}
.hour i{height:16px;background:var(--ink);display:block;min-width:1px}
.hour u{font-family:var(--display);font-size:16px;text-decoration:none;text-align:right}
.hour.now em,.hour.now u{color:var(--ink)}
.hour.now em::after{content:"\00a0\2039"}
.hour.over i{background:var(--alarm)}
.hour.over u{color:var(--alarm)}
.hour.past{opacity:.42}
.hour.zero{opacity:.34}
.track{background:rgba(20,63,20,.1);height:16px;display:block}

/* ---------- queue ---------- */
.rule{
  display:flex;align-items:center;gap:12px;padding:16px var(--pad) 8px;
  font-family:var(--display);font-size:15px;letter-spacing:.2em;color:var(--ink-2)
}
.rule::after{content:"";flex:1;height:1px;background:rgba(20,63,20,.18)}
.rule.now{color:var(--alarm)}
.rule.now::after{background:var(--alarm)}
.rule.now::before{content:"";width:9px;height:9px;background:var(--alarm);flex:none}

.ticket{
  border-bottom:var(--hair-soft);padding:12px var(--pad);cursor:pointer;
  display:grid;grid-template-columns:auto 1fr auto;gap:4px 16px;align-items:start
}
.ticket:active{background:var(--paper)}
.ticket .t{
  font-family:var(--display);font-size:clamp(26px,2.8vw,38px);line-height:.9;letter-spacing:.01em;
  grid-column:1;grid-row:1/span 2;padding-top:2px;font-variant-numeric:tabular-nums
}
.ticket .who{
  font-family:var(--display);font-size:clamp(16px,1.6vw,21px);letter-spacing:.08em;line-height:1.1;
  grid-column:2;grid-row:1
}
.ticket .who span{color:var(--ink-2)}
.ticket .what{font-size:clamp(15px,1.5vw,19px);line-height:1.35;grid-column:2;grid-row:2;min-width:0;overflow-wrap:anywhere}
.ticket .what s{text-decoration:none;color:var(--ink-2)}
.ticket .flag{
  grid-column:3;grid-row:1/span 2;font-family:var(--display);font-size:14px;letter-spacing:.14em;
  border:var(--hair);padding:6px 10px;white-space:nowrap;align-self:start;text-align:center;
  min-width:104px;line-height:1.1
}
.ticket .flag b{display:block;font-size:26px;font-weight:400;letter-spacing:.02em;margin-bottom:2px}
.ticket .flag.bad{border-color:var(--alarm);color:var(--alarm)}
.ticket .flag.go{background:var(--ink);color:var(--page)}

.ticket.settled .t,.ticket.settled .who,.ticket.settled .what{opacity:.36}
.ticket.void .what,.ticket.void .who{text-decoration:line-through}
.ticket.late .t{color:var(--alarm)}
.ticket.stale .t,.ticket.stale .who,.ticket.stale .what,.ticket.stale .flag{opacity:.5}

/* ---------- expanded ---------- */
.detail{grid-column:1/-1;grid-row:3;padding:14px 0 4px;display:none}
.ticket.open .detail{display:block}
.ticket.open{background:var(--paper)}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin-bottom:14px}
.detail dt{font-family:var(--display);font-size:12px;letter-spacing:.16em;color:var(--ink-2);padding-top:3px}
.detail dd{color:var(--ink)}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.acts button{
  border:var(--hair);padding:14px 18px;font-family:var(--display);
  font-size:clamp(15px,1.5vw,19px);letter-spacing:.1em;flex:1;min-width:130px;background:var(--page)
}
.acts button[aria-pressed="true"]{background:var(--ink);color:var(--page)}
.acts button.bad{border-color:var(--alarm);color:var(--alarm)}
.acts button.bad[aria-pressed="true"]{background:var(--alarm);color:var(--page)}

.empty{padding:calc(var(--pad)*2);font-size:17px;color:var(--ink-2);max-width:34em}
.nobook{padding:calc(var(--pad)*2);max-width:36em}
.nobook h2{
  font-family:var(--display);font-weight:400;font-size:clamp(30px,4vw,52px);
  letter-spacing:.02em;line-height:1;margin:10px 0 20px
}
.nobook p{font-size:clamp(16px,1.7vw,20px);line-height:1.5;color:var(--ink-2);max-width:30em}
.nobook p+p{margin-top:14px}
.nobook b{color:var(--ink);font-weight:400;border-bottom:2px solid var(--ink)}
.jump{
  font-family:var(--display);font-size:clamp(14px,1.4vw,18px);letter-spacing:.12em;
  border:var(--hair);padding:14px 20px;margin-top:8px;background:var(--page)
}
.jump:active{background:var(--ink);color:var(--page)}
.foot{margin-top:auto;padding-top:14px;border-top:var(--hair-soft);font-size:12.5px;color:var(--ink-2);line-height:1.45}

/* ---------- the Monday number ----------
   Not a kitchen sign. This one gets read on his phone with a coffee, so it is a
   single column at reading width, and it prints to one page. */
.paper{flex:1;min-height:0;overflow-y:auto;background:var(--paper);padding:0 var(--pad) 60px}
.sheet{max-width:760px;margin:0 auto}

.weeknav{
  display:flex;align-items:center;gap:14px;padding:18px 0 14px;
  border-bottom:var(--hair);margin-bottom:26px
}
.weeknav b{font-family:var(--display);font-size:clamp(19px,2.2vw,27px);letter-spacing:.05em;font-weight:400}
.weeknav b i{font-style:normal;display:block;font-size:.5em;letter-spacing:.2em;color:var(--ink-2);margin-top:5px}
.weeknav button{
  font-family:var(--display);font-size:18px;border:var(--hair);
  width:40px;height:40px;flex:none;background:var(--page)
}
.weeknav button:disabled{opacity:.28}
.weeknav button:not(:disabled):active{background:var(--ink);color:var(--page)}
.weeknav .gap{margin-left:auto}

.took{margin-bottom:8px}
.took .money{
  font-family:var(--display);font-size:clamp(58px,9vw,104px);line-height:.86;letter-spacing:-.01em;margin:8px 0 12px
}
/* The Arcade figure is typed, so it is an input wearing the same clothes. */
.took .money:has(.bigfield){display:flex;align-items:baseline}
.took .quid{opacity:.5}
.bigfield{
  font-family:var(--display);font-size:inherit;line-height:inherit;letter-spacing:inherit;
  color:var(--ink);width:5.6ch;border:0;border-bottom:4px solid var(--ink-3);
  background:none;padding:0;text-align:left
}
.bigfield:focus{outline:0;border-bottom-color:var(--go)}
.said{font-size:clamp(16px,1.7vw,20px);line-height:1.45;max-width:32em}
.said b{font-weight:400;border-bottom:2px solid var(--ink)}
.said .up{color:var(--ink);border-bottom-color:var(--ink)}
.said .down{color:var(--alarm);border-bottom-color:var(--alarm)}

.block{margin-top:34px}
.block>.label{padding-bottom:10px;border-bottom:var(--hair);margin-bottom:4px;display:block}

.week{width:100%;border-collapse:collapse}
.week td{padding:11px 0;border-bottom:var(--hair-soft);vertical-align:middle}
.week .d{font-family:var(--display);font-size:clamp(15px,1.5vw,19px);letter-spacing:.12em;width:4.6em;white-space:nowrap}
.week .m{font-family:var(--display);font-size:clamp(17px,1.8vw,23px);text-align:right;width:5.4em;white-space:nowrap;font-variant-numeric:tabular-nums}
/* 99% so the bar column claims whatever the fixed columns do not want. */
.week .bar{width:99%;padding-left:16px;padding-right:16px}
.week .bar span{display:block;background:rgba(20,63,20,.1);height:14px}
.week .bar i{display:block;background:var(--ink);height:14px;min-width:1px}
.week .p{font-size:14px;color:var(--ink-2);text-align:right;width:6.2em;white-space:nowrap}
.week tr.best .m,.week tr.best .d{color:var(--ink)}
.week tr.shut{opacity:.34}
.week tr.shut .bar span{background:none}
.week .tag{font-family:var(--display);font-size:11px;letter-spacing:.14em;color:var(--ink-2);padding-left:12px;white-space:nowrap}
.week .tag.bad{color:var(--alarm)}

.sites{width:100%;border-collapse:collapse}
.sites td{padding:12px 0;border-bottom:var(--hair-soft);vertical-align:middle}
.sites .s{font-family:var(--display);font-size:clamp(15px,1.5vw,19px);letter-spacing:.1em}
.sites .v{
  font-family:var(--display);font-size:clamp(18px,1.9vw,24px);text-align:right;
  white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:14px
}
.sites .quid{opacity:.55}
.sites input{
  font:inherit;color:var(--ink);width:4.2em;border:0;border-bottom:2px solid var(--ink-3);
  background:none;padding:0 0 2px;text-align:right;-moz-appearance:textfield
}
.sites input::-webkit-outer-spin-button,.sites input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.sites input:focus{outline:0;border-bottom-color:var(--go);border-bottom-width:3px}
.sites .sh{font-size:14px;color:var(--ink-2);text-align:right;width:3.4em;padding-left:14px}
.sites .mv{font-size:13px;color:var(--ink-2);text-align:right;width:7em;white-space:nowrap;padding-left:14px}
.sites .mv.down{color:var(--alarm)}
.sites .src{font-family:var(--display);font-size:10px;letter-spacing:.14em;color:var(--ink-2);text-align:right;padding-left:14px;white-space:nowrap}
.hint{font-size:14px;color:var(--ink-2);line-height:1.5;margin-top:12px;max-width:44em}
.hint b{font-weight:400;color:var(--ink);border-bottom:2px solid var(--ink)}
.hint b.down{color:var(--alarm);border-bottom-color:var(--alarm)}

.sold{width:100%;border-collapse:collapse}
.sold td{padding:10px 0;border-bottom:var(--hair-soft)}
.sold .n{font-size:clamp(16px,1.6vw,20px)}
.sold .q{font-family:var(--display);font-size:clamp(17px,1.8vw,23px);text-align:right;width:3.4em;font-variant-numeric:tabular-nums}
.sold .mv{font-size:13px;color:var(--ink-2);text-align:right;width:7em;white-space:nowrap}
.sold .mv.down{color:var(--alarm)}
.sold .mv.new{color:var(--ink)}

.cost{border:var(--hair);padding:16px 18px;font-size:clamp(16px,1.6vw,20px);line-height:1.5}
.cost b{font-weight:400;border-bottom:2px solid var(--alarm)}
.cost p+p{margin-top:9px}

.note{margin-top:30px;padding-top:16px;border-top:var(--hair-soft);font-size:13px;color:var(--ink-2);line-height:1.5}

/* ---------- gift cards ----------
   Same sheet as the Monday number. A card is a code with a balance, and this
   screen is the book of them. */
.findcard{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.findcard .jump{margin-top:0;flex:none}
.codefield{
  font-family:var(--display);font-size:clamp(20px,2.2vw,28px);letter-spacing:.08em;
  color:var(--ink);background:var(--page);border:var(--hair);padding:10px 14px;
  flex:1 1 240px;min-width:0;text-transform:uppercase;border-radius:0;-webkit-appearance:none
}
.codefield:focus{outline:2px solid var(--go);outline-offset:2px}
.codefield::placeholder{color:rgba(20,63,20,.32)}
.codefield.amt{flex:0 1 170px;text-align:center;text-transform:none}
.codeline{font-family:var(--display);font-size:clamp(30px,4.2vw,54px);letter-spacing:.08em;line-height:1;margin:10px 0 6px;overflow-wrap:anywhere}
.cards{width:100%;border-collapse:collapse}
.cards td{padding:13px 0;border-bottom:var(--hair-soft);vertical-align:middle}
.cards tr{cursor:pointer}
.cards tr:active{background:var(--page)}
.cards .c{font-family:var(--display);font-size:clamp(16px,1.7vw,21px);letter-spacing:.08em;white-space:nowrap}
.cards .st{font-size:13px;color:var(--ink-2);padding-left:14px;white-space:nowrap}
.cards .v{font-family:var(--display);font-size:clamp(17px,1.8vw,23px);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;width:6em}
.wallets{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 10px}
.wallets button{
  border:var(--hair);padding:15px 18px;font-family:var(--display);
  font-size:clamp(14px,1.5vw,18px);letter-spacing:.1em;flex:1;min-width:190px;
  background:var(--page);opacity:.38;cursor:default
}

/* ---------- the customer's card page ----------
   Opened by the QR on the back of a card. Reads like the card itself: one sheet,
   hairline border, nothing to learn. */
.cardpage{min-height:100dvh;background:var(--paper);padding:clamp(16px,4vw,44px);display:flex;justify-content:center;align-items:flex-start}
.cardpaper{width:100%;max-width:460px;background:var(--page);border:var(--hair);padding:clamp(22px,5vw,36px)}
.cardpaper img{width:74px;height:74px;display:block;margin-bottom:18px}
.cardpaper .huge{font-size:clamp(56px,16vw,92px)}
.cardpaper h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,9vw,44px);letter-spacing:.02em;line-height:1;margin:14px 0 12px}
.cardpaper .hint{margin-top:12px}
.cardpaper .block{margin-top:26px}
.cardpaper .codeline{font-size:clamp(26px,7vw,40px)}

@media (max-width:600px){
  /* Header has to hold a logo, the site, a view switch and a clock. On a phone the
     date and the subtitle are the parts nobody needs. */
  .site small{display:none}
  .clock span{display:none}
  /* Three switches no longer fit beside the site name, so the switch takes its
     own row under the masthead, like a segmented control. */
  header{gap:10px;flex-wrap:wrap;row-gap:9px}
  .switch{order:5;flex-basis:100%;margin-left:0}
  .switch button{flex:1 1 auto;padding:8px 4px;letter-spacing:.08em}

  .week .d{width:auto;font-size:14px}
  .week .m{width:auto;font-size:17px}
  .week .bar{padding-left:10px;padding-right:10px}
  .week .p{width:auto;font-size:12px}
  .week .tag{padding-left:8px;font-size:10px}
  .sold .mv{width:auto;font-size:12px;padding-left:10px}
  .sold .q{width:auto;padding-left:10px}
  .weeknav{flex-wrap:wrap}
  .took .money{font-size:clamp(48px,15vw,74px)}
}

@media print{
  header,.band,.switch,.weeknav button{display:none}
  .paper{overflow:visible;padding:0}
  #app{height:auto}
  .sheet{max-width:none}
  .took .money{font-size:64px}
}

/* ---------- narrow: his phone ----------
   The number first, then the book, then the things you set once. Whole page
   scrolls, because a phone with two scrolling panes is a phone you fight. */
@media (max-width:860px){
  #app{height:auto;min-height:100dvh}
  header{position:sticky;top:0;z-index:3}
  main{
    grid-template-columns:minmax(0,1fr);
    grid-template-areas:"top" "queue" "rest";
    grid-template-rows:auto auto auto
  }
  .queue{overflow:visible;padding-bottom:0;border-right:0;border-top:var(--hair);border-bottom:var(--hair)}
  .rail-rest{overflow:visible;padding-top:var(--pad)}
  .rail-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 18px;align-items:center}
  .rail-top .totals{grid-column:1}
  .rail-top .callout{grid-column:2}
  .huge{font-size:66px;margin:2px 0 4px}
  .foot{margin-top:0}
  .ticket{padding:14px var(--pad)}
  .ticket .t{font-size:30px}
  .ticket .flag{min-width:76px;font-size:11px;letter-spacing:.1em;padding:5px 6px}
  .ticket .flag b{font-size:22px}
  .acts button{min-width:100%}
}
@media (max-width:520px){
  .rail-top{grid-template-columns:minmax(0,1fr)}
  .rail-top .callout{grid-column:1}
}

/* The whole business.

   St Albans is his: his till, his book, so the desk and the day by day come from it.

   takes the payment and owns the data, so there is no feed to read. What there is,
   is a settlement: Arcade tracks his sales in order to pay him, and something lands
   in his inbox.

   So those sites are typed in, one number a week, off whatever Arcade sends. Thirty
   seconds, and the Monday number covers all of it today instead of waiting. When we

function seedOf(str){
  let h=2166136261>>>0;
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619)>>>0; }
  return h>>>0;
}
function rngFrom(seed){
  let a=seed>>>0;
  return function(){
    a=(a+0x6D2B79F5)|0;
    let t=Math.imul(a^(a>>>15), 1|a);
    t=(t+Math.imul(t^(t>>>7), 61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
const pick = (r,list) => list[Math.floor(r()*list.length)];
const between = (r,lo,hi) => lo+Math.floor(r()*(hi-lo+1));
function weighted(r,list,key){
  const total=list.reduce((s,x)=>s+x[key],0);
  let n=r()*total;
  for(const x of list){ n-=x[key]; if(n<=0) return x; }
  return list[list.length-1];
}

// Shape of the day. A neighbourhood pizzeria fills from about seven, but it is a
// broad hill, not a spike — the kitchen would not survive a spike.
function curveWeight(minute, openM, closeM){
  const peak1 = mins("13:00"), peak2 = mins("19:15");
  const near = (m,p,spread) => Math.exp(-Math.pow((m-p)/spread,2));
  let w = 0.28;
  if(openM < mins("15:00")) w += 0.50*near(minute,peak1,80);
  w += 1.00*near(minute,peak2,120);
  if(minute > closeM-60) w *= 0.6;
  return w;
}

// Lay the day's bookings out across the slots in proportion to that shape, rather
// than dropping them at random. A random draw clumps, and a room with fourteen
// tables does not take thirteen bookings in one hour. capPerSlot is the ceiling.
function spreadTimes(r, count, openM, closeM, step, capPerSlot){
  const slots=[];
  for(let m=openM; m<=closeM; m+=step){
    slots.push({m, w:Math.max(0.01, curveWeight(m,openM,closeM) * (0.7 + 0.6*r())), n:0});
  }
  const total = slots.reduce((s,x)=>s+x.w, 0) || 1;
  slots.forEach(s=>{ s.exact = count*s.w/total; s.n = Math.min(capPerSlot, Math.floor(s.exact)); });

  let left = count - slots.reduce((s,x)=>s+x.n, 0);
  const byRemainder = slots.slice().sort((a,b)=> (b.exact-Math.floor(b.exact)) - (a.exact-Math.floor(a.exact)));
  for(const s of byRemainder){ if(left<=0) break; if(s.n<capPerSlot){ s.n++; left--; } }

  let guard = 0;                                   // every slot full, spill outward
  while(left>0 && guard++ < count*4){
    let moved=false;
    for(const s of byRemainder){ if(left<=0) break; if(s.n<capPerSlot){ s.n++; left--; moved=true; } }
    if(!moved) break;
  }

  const out=[];
  slots.forEach(s=>{ for(let i=0;i<s.n;i++) out.push(s.m); });
  return out.sort((a,b)=>a-b);
}

function makePies(r, howMany, vegOnly){
  const menu = PIZZAS.filter(p=>p.on && (!vegOnly || p.veg));
  // Margherita and New Haven carry a neighbourhood pizzeria. Weight accordingly.
  const weightOf = p => p.name==="Margherita" ? 26
                      : p.name==="New Haven 'Apizza'" ? 20
                      : p.name==="Plain Tom" ? 13
                      : p.name.startsWith("Special") ? 5 : 10;
  const rows=[];
  for(let i=0;i<howMany;i++){
    const pie = weighted(r, menu.map(p=>({p, w:weightOf(p)})), "w").p;
    const size = weighted(r, SIZES, "weight");
    const mods=[];
    if(r()<0.24) mods.push(pick(r,TOPPINGS).name);
    if(r()<0.07) mods.push("Gluten Free Base");
    const key = pie.name+"|"+size.name+"|"+mods.join(",");
    const seen = rows.find(x=>x.key===key);
    if(seen) seen.qty++;
    else rows.push({key, qty:1, name:pie.name, size:size.name, mods, pie:true, price:pie.price+size.add});
  }
  return rows;
}

function simulate(dateISO){
  const d = dateFromISO(dateISO);
  const wd = d.getDay();
  const h = VENUE.hours[wd];
  const r = rngFrom(seedOf(dateISO));

  const openM = mins(h.open), closeM = mins(h.close);
  const lunch = openM < mins("15:00");

  const busy = wd===6 ? 1.00 : wd===5 ? 0.90 : wd===0 ? 0.72 : wd===4 ? 0.66 : 0.55;
  const tableCount   = Math.round((22 + r()*10) * busy);
  const collectCount = Math.round((20 + r()*10) * busy);

  const tickets=[];
  const usedTables=new Map();

  // ---- tables -------------------------------------------------------------
  const tTimes = spreadTimes(r, tableCount, lunch?mins(VENUE.lunchFrom):mins("17:00"), closeM-45, 15, 3);
  tTimes.forEach((m,i)=>{
    const party = weighted(r,[
      {n:2,w:40},{n:3,w:18},{n:4,w:25},{n:5,w:8},{n:6,w:9}
    ],"w").n;

    let table = 1 + ((i*5 + Math.floor(r()*VENUE.tables)) % VENUE.tables);
    let guard = 0;
    while(usedTables.has(table) && Math.abs(usedTables.get(table)-m) < 90 && guard++ < VENUE.tables){
      table = 1 + (table % VENUE.tables);
    }
    usedTables.set(table, m);

    const vegTable = r()<0.12;
    let pies = Math.max(1, Math.round(party*0.9 + (r()<0.3?1:0) - (r()<0.2?1:0)));
    const items = makePies(r, pies, vegTable);

    if(r()<0.45){ const s=pick(r,SIDES); items.push({qty:1,name:s.name,price:s.price}); }
    if(r()<0.25){ const s=pick(r,DIPS);  items.push({qty:1,name:s.name,price:s.price}); }
    if(r()<0.70){
      const n = between(r,1,Math.max(1,party-1));
      const dr = pick(r,DRINKS);
      items.push({qty:n,name:dr.name,price:dr.price});
    }

    tickets.push(makeTicket({
      id:"t"+dateISO+"-"+i, kind:"table", minute:m, table, party,
      name: pick(r,FIRST)+" "+pick(r,LAST),
      items,
      note: r()<0.20 ? pick(r,TABLE_NOTES) : "",
      phone:"07"+between(r,100,999)+" "+between(r,100000,999999),
      placed: clock(Math.max(mins(VENUE.preordersOpen), m - between(r,120,2880)))
    }));
  });

  // ---- collection ---------------------------------------------------------
  // Capped at their own setting: three orders per ten minute slot.
  const cTimes = spreadTimes(r, collectCount, openM+VENUE.collectionPrepTime, closeM,
                             VENUE.slotMinutes, VENUE.ordersPerSlot);
  cTimes.forEach((m,i)=>{
    const pies = weighted(r,[{n:1,w:30},{n:2,w:40},{n:3,w:20},{n:4,w:10}],"w").n;
    const items = makePies(r, pies, r()<0.10);
    if(r()<0.35){ const s=pick(r,SIDES); items.push({qty:1,name:s.name,price:s.price}); }
    if(r()<0.20){ const s=pick(r,DIPS);  items.push({qty:1,name:s.name,price:s.price}); }
    if(r()<0.30){ const dr=pick(r,DRINKS); items.push({qty:between(r,1,2),name:dr.name,price:dr.price}); }

    tickets.push(makeTicket({
      id:"c"+dateISO+"-"+i, kind:"collect", minute:m,
      name: pick(r,FIRST)+" "+pick(r,LAST),
      items,
      note: r()<0.16 ? pick(r,COLLECT_NOTES) : "",
      phone:"07"+between(r,100,999)+" "+between(r,100000,999999),
      placed: clock(Math.max(mins(VENUE.preordersOpen), m - between(r,60,600)))
    }));
  });

  tickets.sort((a,b)=> a.minute-b.minute || a.kind.localeCompare(b.kind));

  // A day already gone has an ending. Roughly one table in fourteen does not turn
  // up and a few cancel, which is exactly the number Monday's email exists to show
  // him. Today and the days ahead stay open until the kitchen taps them.
  if(dateISO < toISO(new Date())){
    tickets.forEach(t=>{
      const roll = r();
      t.outcome = t.kind==="table"
        ? (roll<0.07 ? "noshow" : roll<0.11 ? "cancelled" : "arrived")
        : (roll<0.03 ? "noshow" : roll<0.05 ? "cancelled" : "collected");
    });
  }

  return tickets;
}

function arcadeFor(week, site){

/* ============================================================================
   6b. GIFT CARDS  —  a code with a balance. That is the whole thing.

      The code is the product. The printed card, the email and the wallet pass
      are three ways of carrying it, so this is one book, not three systems.
      Kept on the device like everything else the kitchen touches, in exactly
      the shape a server holds the day it goes live.

      A card arrives dead. Money lands on it at the till, comes off it at the
      till, and the customer's page (?gift=CODE) reads the same book, so the
      two screens cannot disagree.
   ========================================================================= */

// Nothing that reads two ways: no 0, O, 1, I or L on a scuffed card.
const CODE_AB = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function makeCode(){
  let s=""; for(let i=0;i<8;i++) s+=CODE_AB[Math.floor(Math.random()*CODE_AB.length)];
  return "GRC-"+s.slice(0,4)+"-"+s.slice(4);
}
// He will type it lower case, with or without the dashes, off the back of a card.
function normCode(raw){
  let s=String(raw||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(s.length===11 && s.startsWith("GRC")) s=s.slice(3);
  if(!/^[A-Z0-9]{8}$/.test(s)) return null;
  return "GRC-"+s.slice(0,4)+"-"+s.slice(4,8);
}
// "£25", "25", "18.50" — whatever gets typed with a queue behind it.
function parsePence(raw){
  const n=Number(String(raw||"").replace(/[£,\s]/g,""));
  if(!isFinite(n) || n<=0) return null;
  return Math.round(n*100);
}

const cardsStored = () => store.read("gift", {});
function saveCard(c){ const m=cardsStored(); delete c.sample; m[c.code]=c; store.write("gift", m); }

// Three made-up cards so the screen has a shape before the first sale: one part
// spent, one untouched, one printed but not sold. The first touch makes a card
// real, and the sample copy never comes back.
function sampleCards(){
  if(SOURCE.live) return [];
  const t = toISO(new Date());
  return [
    {code:"GRC-4K2P-8HQV", state:"live", loaded:5000, pence:1750, sample:true,
     history:[{iso:shiftDays(t,-9),kind:"loaded",pence:5000},
              {iso:shiftDays(t,-6),kind:"spent",pence:1850},
              {iso:shiftDays(t,-2),kind:"spent",pence:1400}]},
    {code:"GRC-TW8N-M3RD", state:"live", loaded:2500, pence:2500, sample:true,
     history:[{iso:shiftDays(t,-1),kind:"loaded",pence:2500}]},
    {code:"GRC-9FHV-K2WD", state:"dead", loaded:0, pence:0, sample:true, history:[]}
  ];
}
function cardBy(code){
  return cardsStored()[code] || sampleCards().find(c=>c.code===code) || null;
}
function cardBook(){
  const real = Object.values(cardsStored());
  const seen = new Set(real.map(c=>c.code));
  const last = c => c.history.length ? c.history[c.history.length-1].iso : "";
  return real.concat(sampleCards().filter(c=>!seen.has(c.code)))
             .sort((a,b)=> last(b).localeCompare(last(a)));
}
function activateCard(code, pence){
  const c = cardBy(code) || {code, state:"dead", loaded:0, pence:0, history:[]};
  c.state="live"; c.loaded+=pence; c.pence+=pence;
  c.history.push({iso:toISO(new Date()), kind:"loaded", pence});
  saveCard(c);
}
function spendCard(code, pence){
  const c = cardBy(code); if(!c || c.state!=="live") return;
  c.pence = Math.max(0, c.pence - pence);
  c.history.push({iso:toISO(new Date()), kind:"spent", pence});
  saveCard(c);
}
// A refund keeps the trail. Nothing is rubbed out of a money book.
function refundCard(code){
  const c = cardBy(code); if(!c) return;
  const lastSpend = c.history[c.history.length-1];
  if(!lastSpend || lastSpend.kind!=="spent") return;
  c.pence += lastSpend.pence;
  c.history.push({iso:toISO(new Date()), kind:"back", pence:lastSpend.pence});
  saveCard(c);
}

const pieCount = t => t.items.reduce((s,i)=> s + (i.pie ? i.qty : 0), 0);
const bigCount = t => t.items.reduce((s,i)=> s + (i.pie && i.size==='16"' ? i.qty : 0), 0);
const ticketTotal = t => t.items.reduce((s,i)=> s + i.qty*(i.price||0), 0);

function readDay(iso, tickets){
  const live = tickets.filter(t=>!VOID(statusOf(iso,t)));
  const pies = live.reduce((s,t)=>s+pieCount(t),0);
  const big  = live.reduce((s,t)=>s+bigCount(t),0);
  const dough = doughFor(iso);
  const h = VENUE.hours[dateFromISO(iso).getDay()];

  const byHour=new Map();
  for(let m=mins(h.open); m<=mins(h.close); m+=60) byHour.set(Math.floor(m/60), {pies:0, big:0});
  live.forEach(t=>{
    const hr=Math.floor(t.minute/60);
    if(!byHour.has(hr)) byHour.set(hr,{pies:0,big:0});
    byHour.get(hr).pies += pieCount(t);
    byHour.get(hr).big  += bigCount(t);
  });

  return {
    tickets, live, pies, big, dough,
    left: dough - pies,
    covers: live.filter(t=>t.kind==="table").reduce((s,t)=>s+(t.party||0),0),
    hours:[...byHour.entries()].sort((a,b)=>a[0]-b[0]),
    open:mins(h.open), close:mins(h.close), collectionOff:!!h.collectionOff
  };
}

// When the dough runs out.
//
// Not a guess at a pace. It walks the book in time order and finds the booking
// where the running total passes the dough, which is the booking that gets no
// pizza. Nothing here is extrapolated, so nothing here can be wrong.
function sellOut(iso, day){
  let run = 0;
  for(const t of day.live){
    run += pieCount(t);
    if(run > day.dough){
      const who = t.kind==="table" ? "Table "+t.table+" at "+clock(t.minute) : "The "+clock(t.minute)+" collection";
      return {
        tone:"bad",
        line:"DOUGH RUNS OUT "+clock(t.minute),
        note:who+" is the one that misses out. "+(day.pies-day.dough)+" pies short across the day."
      };
    }
  }

  if(day.left === 0) return {tone:"", line:"EVERY BALL SPOKEN FOR", note:"Nothing spare. Take no more."};

  // What is left, said as orders rather than as a number nobody can act on.
  const collects = day.live.filter(t=>t.kind==="collect");
  const perOrder = collects.length ? Math.max(1, collects.reduce((s,t)=>s+pieCount(t),0)/collects.length) : 2;
  const room = Math.floor(day.left/perOrder);

  return {
    tone:"",
    line:"HOLDS THE DAY",
    note:day.left+" balls spare on the last booking. Room for about "+room+" more collections."
  };
}


/* ============================================================================
   7b. THE MONDAY NUMBER

      What St Albans did last week, read straight off the same book the desk runs
      on. This is the half of the Monday number that does not wait on Arcade.

      The other three sites plug in here as a second source the day James forwards
      whatever Arcade sends him. Everything below is written so that adding them is
      adding rows, not rewriting the maths.
   ========================================================================= */

function shiftDays(iso, n){
  const d = dateFromISO(iso); d.setDate(d.getDate()+n); return toISO(d);
}
// Monday of whatever week that date falls in.
function mondayOf(iso){
  const d = dateFromISO(iso);
  return shiftDays(iso, -((d.getDay()+6)%7));
}

async function readWeek(mondayISO){
  const today = toISO(new Date());
  const days = [];

  for(let i=0;i<7;i++){
    const iso = shiftDays(mondayISO, i);
    if(iso > today){ days.push({iso, future:true, took:0, pies:0, covers:0, collections:0}); continue; }

    let tickets = [];
    try{ tickets = await SOURCE.tickets(iso); }catch(e){ tickets = []; }

    const served = tickets.filter(t=>!VOID(statusOf(iso,t)));
    const lost   = tickets.filter(t=> VOID(statusOf(iso,t)));
    const pies   = served.reduce((s,t)=>s+pieCount(t),0);

    days.push({
      iso, future:false,
      took: served.reduce((s,t)=>s+ticketTotal(t),0),
      pies,
      covers: served.filter(t=>t.kind==="table").reduce((s,t)=>s+(t.party||0),0),
      collections: served.filter(t=>t.kind==="collect").length,
      lostTook: lost.reduce((s,t)=>s+ticketTotal(t),0),
      lostPies: lost.reduce((s,t)=>s+pieCount(t),0),
      lostCovers: lost.filter(t=>t.kind==="table").reduce((s,t)=>s+(t.party||0),0),
      noShows: lost.filter(t=>statusOf(iso,t)==="noshow").length,
      soldOut: pies > doughFor(iso),
      sellers: served.reduce((m,t)=>{
        t.items.forEach(i=>{ if(i.pie) m[i.name] = (m[i.name]||0) + i.qty; });
        return m;
      },{})
    });
  }

  const traded = days.filter(d=>!d.future);
  const sum = k => traded.reduce((s,d)=>s+(d[k]||0),0);

  const sellers = {};
  traded.forEach(d=> Object.entries(d.sellers).forEach(([k,v])=> sellers[k]=(sellers[k]||0)+v));

  return {
    monday:mondayISO, days, traded,
    took:sum("took"), pies:sum("pies"), covers:sum("covers"), collections:sum("collections"),
    lostTook:sum("lostTook"), lostPies:sum("lostPies"), lostCovers:sum("lostCovers"),
    noShows:sum("noShows"),
    soldOutDays: traded.filter(d=>d.soldOut),
    best: traded.slice().sort((a,b)=>b.took-a.took)[0] || null,
    quietest: traded.slice().sort((a,b)=>a.took-b.took)[0] || null,
    sellers,
    partial: days.some(d=>d.future)
  };
}


// All of it, in one place. St Albans comes from the book, the Arcade counters come
// from what he was paid. One row per site, whatever the source.
function readBusiness(week, before){
  const rows = SITES.map(s=>{
    if(s.source==="till"){
      return {site:s, took:week.took, wasTook:before.took, source:"till", typed:true};
    }
    const now = arcadeFor(week.monday, s.id);
    const was = arcadeFor(before.monday, s.id);
    return {site:s, took:now.pence, wasTook:was.pence, source:"arcade", typed:now.typed};
  });

  const took = rows.reduce((t,r)=>t+r.took, 0);
  rows.forEach(r=> r.share = took ? Math.round(r.took/took*100) : 0);

  return {
    rows, took,
    was: rows.reduce((t,r)=>t+r.wasTook, 0),
    anyTyped: rows.some(r=>r.source==="arcade" && r.typed),
    arcadeCount: rows.filter(r=>r.source==="arcade").length
  };
}

function drawQueue(day){

        </dl>

          <button class="bad" data-act="noshow"    data-id="${t.id}" aria-pressed="${st==="noshow"}">NO SHOW</button>

        </div>
      </div>

  if(showNow && !nowDrawn) html += `<div class="rule now">NOW ${clock(now)}</div>`;

function weekLabel(mondayISO){
  const a = dateFromISO(mondayISO), b = dateFromISO(shiftDays(mondayISO,6));
  return a.getMonth()===b.getMonth()
    ? a.getDate()+" TO "+b.getDate()+" "+MONTH[b.getMonth()]
    : a.getDate()+" "+MONTH[a.getMonth()]+" TO "+b.getDate()+" "+MONTH[b.getMonth()];
}

// Up or down, said the way a person would say it.
function movement(now, before, asMoney){
  if(!before) return null;
  const diff = now-before;
  if(diff===0) return null;
  const size = asMoney ? pounds(Math.abs(diff)) : Math.abs(diff);
  const pct  = Math.round(Math.abs(diff)/before*100);
  // "about 0%" is not worth saying.
  return {up:diff>0, text:(diff>0?"up ":"down ")+size, pct, says:pct>=1};
}

      <span class="label">WHAT SOLD</span>
      <table class="sold"><tbody>
        ${sellers.map(([name,qty])=>{
          const was = before.sellers[name] || 0;
          const mv  = !was ? {cls:"new", text:"new this week"}
                    : qty===was ? {cls:"", text:"level"}
                    : {cls:qty>was?"":"down", text:(qty>was?"up ":"down ")+Math.abs(qty-was)};
          return `<tr>
            <td class="n">${esc(name)}</td>
            <td class="q">${qty}</td>
            <td class="mv ${mv.cls}">${mv.text}</td>
          </tr>`;
        }).join("") || `<tr><td class="n">Nothing sold this week.</td></tr>`}
      </tbody></table>
    </div>

    <div class="block">
      <span class="label">WHAT IT COST YOU</span>
      <div class="cost">
        ${week.noShows || week.lostPies
          ? `<p>${plural(week.noShows,"no-show","no-shows")} and the cancellations took
             <b>${plural(week.lostCovers,"cover","covers")}</b> and
             <b>${plural(week.lostPies,"pizza","pizzas")}</b> off the week,
             worth about <b>${pounds(week.lostTook)}</b>.</p>`
          : `<p>Nobody failed to turn up. Good week.</p>`}
        ${week.soldOutDays.length
          ? `<p>You ran out of dough on
             ${week.soldOutDays.map(d=>DAY_LONG[dateFromISO(d.iso).getDay()].toLowerCase()).join(" and ")}.
             Worth putting more on the night before.</p>`
          : `<p>The dough held every day.</p>`}
      </div>
    </div>

    <p class="note">
      ${SITES.filter(s=>s.source==="arcade").map(s=>s.prose).join(", ")} are the counters
      inside Arcade. They employ the staff and take the payment there, so those figures are whatever
      Arcade settles with you. Forward me one of their statements and they stop being something you
      type.
    </p>

  </div>`;
}


// There is no kitchen screen for the Arcade counters, and there cannot be one.
// Arcade employs the staff, takes the payment and holds the booking book at those
// three, so there is no queue to read and James cannot authorise one. Saying that
// plainly is more use to him than an empty screen pretending to load.
function drawNoBook(){
  const s = siteById(SITE);
  const wk = shiftDays(mondayOf(toISO(new Date())), -7);
  const paid = arcadeFor(wk, s.id);

  $("#days").hidden = true;
  document.querySelector("main").classList.add("solo");   // no rail, nothing to put in it
  $("#queue").innerHTML = `
    <div class="nobook">
      <span class="label">${s.name}</span>
      <h2>ARCADE HOLDS THIS BOOK</h2>
      <p>Arcade takes the bookings and the payments at ${s.prose}. There is no queue here to put on a
      kitchen screen, and it is not yours to switch on.</p>
      <p>What you can see is the money. Last week ${paid.typed?"you had":"they paid you about"}
      <b>${pounds(paid.pence)}</b> from this counter.</p>
      <p><button class="jump" data-jump="${s.id}">SEE ${s.short} ON THE WEEK</button></p>
    </div>`;
  $("#queue").scrollTop = 0;
  $("#railTop").innerHTML = "";
  $("#railRest").innerHTML = "";
}


/* ---- the gift cards screen ---------------------------------------------- */

let GIFT_OPEN = null;    // the code on screen, or null for the book
let GIFT_WARN = "";

function histDate(iso){ const d=dateFromISO(iso); return DAY_SHORT[d.getDay()]+" "+d.getDate()+" "+MONTH[d.getMonth()]; }
const histWord = k => k==="loaded" ? "LOADED" : k==="spent" ? "SPENT" : "PUT BACK";

function giftHistory(c){
  if(!c.history.length) return "";
  return `<div class="block">
    <span class="label">WHAT IT HAS DONE</span>
    <table class="sold"><tbody>
      ${c.history.slice().reverse().map(h=>`<tr>
        <td class="n">${histWord(h.kind)} · ${histDate(h.iso)}</td>
        <td class="q">${money(h.pence)}</td>
      </tr>`).join("")}
    </tbody></table>
  </div>`;
}

// One card, on the till side. Dead means the activation flow, live means the
// redemption flow. Both are the same screen the QR opens, which is the point.
function giftCardPanel(code){
  const c = cardBy(code);
  const live = c && c.state==="live";

  if(!live){
    const printed = !!c;   // a known printed card vs a code never seen before
    return `<div class="block">
      <span class="label">${printed ? "PRINTED · NOT SOLD YET" : "NEW CARD"}</span>
      <div class="codeline">${esc(code)}</div>
      <p class="hint">Nothing on it and nothing to steal, which is the point: cards
      sit by the till dead. Take the money, load it, and it is live from this moment.</p>
      <div class="acts" style="margin-top:16px;max-width:420px">
        <button data-gift-amount="2500">£25</button>
        <button data-gift-amount="5000">£50</button>
        <button data-gift-amount="10000">£100</button>
      </div>
      <div class="findcard" style="margin-top:10px">
        <input class="codefield amt" id="amountIn" inputmode="decimal" placeholder="£" aria-label="What they paid">
        <button class="jump" data-gift-activate="${esc(code)}">TAKE THE MONEY · LOAD IT</button>
      </div>
      ${GIFT_WARN?`<p class="hint" style="color:var(--alarm)">${esc(GIFT_WARN)}</p>`:""}
      <p class="hint">A digital card is the same thing without the cardboard: load it,
      and the link to the customer's side appears here to text or email them.</p>
    </div>`;
  }

  const lastSpend = c.history.length && c.history[c.history.length-1].kind==="spent";
  return `<div class="block">
    <span class="label">${c.sample ? "SAMPLE CARD" : c.pence ? "LIVE" : "SPENT OUT"}</span>
    <div class="codeline">${esc(code)}</div>
    <div class="took" style="margin-top:10px">
      <span class="label">STILL ON IT</span>
      <div class="money">${money(c.pence)}</div>
    </div>
    <p class="said">Of <b>${money(c.loaded)}</b> loaded.
      ${c.sample ? "A made-up card, to show the flow. The first thing you do to it makes it real." : ""}</p>
    <div class="findcard" style="margin-top:16px">
      <input class="codefield amt" id="amountIn" inputmode="decimal" placeholder="£" aria-label="What is coming off">
      <button class="jump" data-gift-redeem="${esc(code)}">TAKE IT OFF</button>
      ${lastSpend?`<button class="jump" data-gift-undo="${esc(code)}">PUT THE LAST ONE BACK</button>`:""}
    </div>
    ${GIFT_WARN?`<p class="hint" style="color:var(--alarm)">${esc(GIFT_WARN)}</p>`:""}
    ${giftHistory(c)}
    <div class="block">
      <span class="label">THE CUSTOMER'S SIDE</span>
      <p class="hint" style="margin-top:12px">The QR on the card opens this same code as a
      page: the balance, what it has done, and the wallet buttons. Their screen and this
      one read the same book, so they never disagree.</p>
      <p style="margin-top:12px"><a class="jump" style="display:inline-block;text-decoration:none;color:inherit"
        href="?gift=${encodeURIComponent(code)}">SEE THEIR SIDE</a></p>
    </div>
  </div>`;
}

function giftBook(){
  const book = cardBook();
  const liveCards = book.filter(c=>c.state==="live");
  const out = liveCards.reduce((s,c)=>s+c.pence,0);
  const anyReal = book.some(c=>!c.sample);

  return `
    <div class="took" style="margin-top:8px">
      <span class="label">OUT THERE, STILL TO BE SPENT</span>
      <div class="money">${money(out)}</div>
    </div>
    <p class="said">${plural(liveCards.length,"live card","live cards")} holding it.
    Money you have already been paid, for pizza not yet made.
    ${anyReal ? "" : "All three are made up, to show the shape."}</p>

    <div class="block">
      <span class="label">EVERY CARD</span>
      <table class="cards"><tbody>
        ${book.map(c=>`<tr data-gift-open="${esc(c.code)}" role="button" tabindex="0">
          <td class="c">${esc(c.code)}</td>
          <td class="st">${c.state==="live" ? (c.pence?"LIVE":"SPENT OUT") : "NOT SOLD YET"}${c.sample?" · SAMPLE":""}</td>
          <td class="v">${c.state==="live" ? money(c.pence) : "&mdash;"}</td>
        </tr>`).join("")}
      </tbody></table>
    </div>`;
}

function drawGift(){
  const arcades = SITES.filter(s=>s.source==="arcade").map(s=>s.prose).join(", ");
  $("#gift").innerHTML = `<div class="sheet">
    <div class="weeknav"><b>GIFT CARDS<i>ONE CODE · ONE BALANCE · ONE BOOK</i></b></div>

    <div class="findcard">
      <input class="codefield" id="codeIn" placeholder="GRC-____-____" autocomplete="off"
        spellcheck="false" aria-label="Card code">
      <button class="jump" data-gift-find>FIND IT</button>
      <button class="jump" data-gift-sell>SELL A NEW CARD</button>
      ${GIFT_OPEN?`<button class="jump" data-gift-back>ALL CARDS</button>`:""}
    </div>
    <p class="hint">Scan the QR on a card and this screen opens on it. Or type the code,
    dashes or not. Selling a digital card starts with a fresh code.</p>

    ${GIFT_WARN && !GIFT_OPEN ? `<p class="hint" style="color:var(--alarm)">${esc(GIFT_WARN)}</p>` : ""}
    ${GIFT_OPEN ? giftCardPanel(GIFT_OPEN) : giftBook()}

    <p class="note">A card spends at St Albans. Arcade takes the payment at ${arcades},
    so a card cannot be redeemed at those counters until that is settled with them.
    Whatever the back of the card says has to be true, so it says St Albans.
    <br><br>Before the first card sells, two questions belong to other people: your
    accountant on when the VAT falls due, and Apple and Google for the wallet accounts,
    which are forms with your name on them, not builds. The wallet buttons sit dark
    until those clear.</p>
  </div>`;
  $("#gift").scrollTop = 0;
}

function giftFind(){
  const field = $("#codeIn");
  const code = normCode(field ? field.value : "");
  if(!code){
    GIFT_OPEN = null;
    GIFT_WARN = (field && field.value.trim())
      ? "That does not read like a card. Codes look like GRC-4K2P-8HQV, dashes or not."
      : "";
    drawGift(); return;
  }
  GIFT_OPEN = code; GIFT_WARN = ""; drawGift();
}


/* ---- the customer's card page (?gift=CODE) ------------------------------- */

function drawCardPage(raw){
  const code = normCode(raw);
  const c = code ? cardBy(code) : null;
  const live = c && c.state==="live";
  $("#app").hidden = true;
  const page = $("#cardpage");
  page.hidden = false;
  document.title = "Gracey's Pizza · Gift Card";

  page.innerHTML = `<div class="cardpaper">
    <img src="${document.querySelector("header img").src}" alt="Gracey's Pizza">
    <span class="label">GIFT CARD</span>
    <div class="codeline">${esc(code || String(raw).toUpperCase())}</div>
    ${!code ? `
      <h2>WE DO NOT KNOW THIS CARD</h2>
      <p class="hint">The code did not read right. Check it against the back of the
      card, or ask at the counter and we will look it up.</p>`
    : !live ? `
      <h2>NOT ACTIVE YET</h2>
      <p class="hint">This card goes live at the till when it is bought. Nothing is on
      it until then, so a card on the rack is worth nothing to anyone.</p>`
    : `
      <div class="block" style="margin-top:18px">
        <span class="label">STILL ON IT</span>
        <div class="huge">${money(c.pence)}</div>
        <p class="sub">of ${money(c.loaded)} loaded</p>
      </div>
      ${giftHistory(c)}
      <div class="wallets">
        <button disabled>ADD TO APPLE WALLET</button>
        <button disabled>ADD TO GOOGLE WALLET</button>
      </div>
      <p class="hint">The wallet buttons switch on once Gracey's accounts with Apple and
      Google clear. The card already works: show this screen, or the card, at the till.</p>
      <p class="hint">Spends at Gracey's Pizza, St Albans.</p>`}
  </div>`;
}

async function draw(){
  drawSites();
  if(siteById(SITE).source !== "till"){ drawNoBook(); return; }
  document.querySelector("main").classList.remove("solo");
  $("#days").hidden = false;
  const day = readDay(VIEW, TICKETS);
  drawDays();
  drawQueue(day);
  drawRail(day);
}

async function load(iso){
  VIEW = iso; OPEN_ID = null;
  try{
    TICKETS = await SOURCE.tickets(iso);
  }catch(e){
    TICKETS = [];
    $("#queue").innerHTML = `<p class="empty">The day would not load. ${esc(e.message)}</p>`;
  }
  draw();
  if(isToday(iso)) scrollToNow();
}

// Last week by default, because that is what lands in his inbox on a Monday.
let WEEK = shiftDays(mondayOf(toISO(new Date())), -7);

async function loadWeek(){
  $("#monday").innerHTML = `<div class="sheet"><p class="note">Adding it up.</p></div>`;
  const [week, before] = [await readWeek(WEEK), await readWeek(shiftDays(WEEK,-7))];
  drawMonday(week, before);
  $("#monday").scrollTop = 0;
}

function showView(v){
  MODE = v==="monday" ? "week" : v==="cards" ? "cards" : "desk";
  // "All sites" is meaningless for a kitchen queue, so coming back to the desk
  // lands on the one site that has a book.
  if(v==="desk" && SITE==="all") SITE = TILL_SITE;
  $("#monday").hidden = v!=="monday";
  $("#gift").hidden   = v!=="cards";
  document.querySelector("main").hidden = v!=="desk";
  // The cards are one book across the brand, so there is no site bar to pick from.
  $("#sites").hidden  = v==="cards";
  $("#days").hidden   = v!=="desk" || siteById(SITE).source!=="till";
  $("#screenName").textContent = v==="monday" ? "THE WEEK" : v==="cards" ? "GIFT CARDS" : "THE DESK";
  $("#siteName").textContent   = v==="cards" ? "GRACEY'S" : SITE==="all" ? "ALL SITES" : siteById(SITE).short;
  $("#bandLabel").textContent  = v==="monday" ? "SAMPLE WEEK" : v==="cards" ? "SAMPLE CARDS" : "SAMPLE DAY";
  $("#bandText").textContent   = v==="monday"
    ? "These are made-up numbers, including the Arcade ones, to show you the shape of it. Type over any of them and your figure stays."
    : v==="cards"
    ? "Three made-up cards, to show the flow. Any card you sell or touch on this screen is real and stays."
    : "These are made-up bookings on the real menu. Your own tables and preorders show up here from the day it goes live.";
  document.querySelectorAll(".switch button").forEach(b=>
    b.setAttribute("aria-current", String(b.dataset.view===v)));
  drawSites();
  if(v==="monday") loadWeek(); else if(v==="cards") drawGift(); else draw();
}

function showSite(id){
  SITE = id;
  if(MODE==="desk" && id==="all") SITE = TILL_SITE;
  $("#siteName").textContent = SITE==="all" ? "ALL SITES" : siteById(SITE).short;
  drawSites();
  if(MODE==="week") loadWeek();
  else if(siteById(SITE).source==="till") load(VIEW);
  else draw();
}

// On the wall screen the book scrolls in its own pane, so bring now into view.
// On a phone the whole page scrolls and the day's number sits directly above the
// book, so leave it alone rather than shoving the number off the top.
function scrollToNow(){
  const q = $("#queue"), mark = document.querySelector(".rule.now");
  if(!q || !mark) return;
  if(q.scrollHeight <= q.clientHeight + 4) return;
  q.scrollTop += mark.getBoundingClientRect().top - q.getBoundingClientRect().top - 80;
}

function tick(){
  const n=new Date();
  $("#clock").textContent = pad2(n.getHours())+":"+pad2(n.getMinutes());
  $("#today").textContent = DAY_LONG[n.getDay()]+" "+n.getDate()+" "+MONTH[n.getMonth()];
}


/* ---- hands on the screen ------------------------------------------------ */

document.addEventListener("click", e=>{
  const view = e.target.closest("[data-view]");
  if(view){ showView(view.dataset.view); return; }

  const siteBtn = e.target.closest("[data-site]");
  if(siteBtn){ showSite(siteBtn.dataset.site); return; }

  const jump = e.target.closest("[data-jump]");   // "see this counter on the week"
  if(jump){ SITE = jump.dataset.jump; showView("monday"); return; }

  const wk = e.target.closest("[data-week]");
  if(wk){
    const next = shiftDays(WEEK, parseInt(wk.dataset.week,10)*7);
    if(next <= mondayOf(toISO(new Date()))){ WEEK = next; loadWeek(); }
    return;
  }

  const dayBtn = e.target.closest("#days button");
  if(dayBtn){ load(dayBtn.dataset.iso); return; }

  /* ---- gift cards ---- */
  const gOpen = e.target.closest("[data-gift-open]");
  if(gOpen){ GIFT_OPEN=gOpen.dataset.giftOpen; GIFT_WARN=""; drawGift(); return; }
  if(e.target.closest("[data-gift-back]")){ GIFT_OPEN=null; GIFT_WARN=""; drawGift(); return; }
  if(e.target.closest("[data-gift-sell]")){ GIFT_OPEN=makeCode(); GIFT_WARN=""; drawGift(); $("#amountIn") && $("#amountIn").focus(); return; }
  if(e.target.closest("[data-gift-find]")){ giftFind(); return; }
  const gAmt = e.target.closest("[data-gift-amount]");
  if(gAmt){
    const f=$("#amountIn");
    if(f){ f.value=String(parseInt(gAmt.dataset.giftAmount,10)/100); f.focus(); }
    return;
  }
  const gAct = e.target.closest("[data-gift-activate]");
  if(gAct){
    const p = parsePence($("#amountIn") && $("#amountIn").value);
    if(p===null){ GIFT_WARN="Type what they paid, like 25 or 32.50, or tap an amount."; drawGift(); return; }
    if(p>50000){ GIFT_WARN="That is more than £500 on one card. Check it before loading."; drawGift(); return; }
    activateCard(gAct.dataset.giftActivate, p);
    GIFT_WARN=""; drawGift(); return;
  }
  const gRed = e.target.closest("[data-gift-redeem]");
  if(gRed){
    const code=gRed.dataset.giftRedeem, card=cardBy(code);
    const p = parsePence($("#amountIn") && $("#amountIn").value);
    if(p===null){ GIFT_WARN="Type what is coming off, like 18.50."; drawGift(); return; }
    if(card && p>card.pence){ GIFT_WARN="Only "+money(card.pence)+" on it. Take that, and the rest another way."; drawGift(); return; }
    spendCard(code,p); GIFT_WARN=""; drawGift(); return;
  }
  const gUndo = e.target.closest("[data-gift-undo]");
  if(gUndo){ refundCard(gUndo.dataset.giftUndo); GIFT_WARN=""; drawGift(); return; }

  const act = e.target.closest("[data-act]");
  if(act){
    e.stopPropagation();
    const t = TICKETS.find(x=>x.id===act.dataset.id);
    const was = t ? statusOf(VIEW, t) : "due";
    setStatus(VIEW, act.dataset.id, was===act.dataset.act ? "due" : act.dataset.act);
    draw();
    return;
  }

  const step = e.target.closest("[data-step]");
  if(step){
    const by = parseInt(step.dataset.by,10);
    if(step.dataset.step==="dough") setDough(VIEW, Math.max(0, doughFor(VIEW)+by));
    else setOven(Math.max(1, ovenPerHour()+by));
    draw();
    return;
  }
  if(e.target.closest(".tile")) return;   // typing in a tile is not a tap on a ticket

  const row = e.target.closest(".ticket");
  if(row){ OPEN_ID = OPEN_ID===row.dataset.id ? null : row.dataset.id; draw(); }
});

document.addEventListener("change", e=>{
  const arc = e.target.closest("[data-arcade]");
  if(arc){
    const v = parseInt(String(arc.value).replace(/[^0-9]/g,""), 10);   // he may type £8,580
    setArcade(WEEK, arc.dataset.arcade, isNaN(v) ? 0 : Math.max(0,v)*100);
    loadWeek();
    return;
  }

  const num = e.target.closest("[data-num]");
  if(!num) return;
  const v = parseInt(num.value,10);
  if(isNaN(v)) { draw(); return; }
  if(num.dataset.num==="dough") setDough(VIEW, Math.max(0,v));
  else setOven(Math.max(1,v));
  draw();
});

document.addEventListener("keydown", e=>{
  if(e.target.closest("[data-num],[data-arcade]") && e.key==="Enter"){ e.target.blur(); return; }
  if(e.key==="Enter" && e.target.id==="codeIn"){ e.preventDefault(); giftFind(); return; }
  if(e.key==="Enter" && e.target.id==="amountIn"){
    e.preventDefault();
    const go = document.querySelector("[data-gift-activate],[data-gift-redeem]");
    if(go) go.click();
    return;
  }
  const gRow = e.target.closest("tr[data-gift-open]");
  if(gRow && (e.key==="Enter" || e.key===" ")){
    e.preventDefault();
    GIFT_OPEN = gRow.dataset.giftOpen; GIFT_WARN=""; drawGift();
    return;
  }
  const row = e.target.closest(".ticket");
  if(row && (e.key==="Enter" || e.key===" ")){
    e.preventDefault();
    OPEN_ID = OPEN_ID===row.dataset.id ? null : row.dataset.id;
    draw();
  }
});


/* ---- start -------------------------------------------------------------- */

// The QR on the back of a gift card opens this same file with ?gift=CODE, so a
// customer's phone gets the card page and nothing else.
const GIFT_LINK = new URLSearchParams(location.search).get("gift");

if(GIFT_LINK !== null){
  drawCardPage(GIFT_LINK);
}else{
  $("#band").hidden = SOURCE.live;
  drawSites();
  tick();
  setInterval(tick, 1000);
  setInterval(()=>{ if(MODE==="desk" && isToday(VIEW)) draw(); }, 30000);
  load(VIEW);
}
</script>
